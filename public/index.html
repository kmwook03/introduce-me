<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="김민욱 포트폴리오">
  <meta name="theme-color" content="#F5F5F5">
  <title>김민욱</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <main id="main" class="wrap">
    <div class="profile-layout">
      <aside class="profile-card" aria-labelledby="profile-name">
        <div class="profile-identity">
        <figure class="portrait">
          <div class="portrait-media">
            <svg id="photo-placeholder" viewBox="0 0 400 435" role="img" aria-label="본인 사진을 추가할 자리">
              <defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#b9c6b1" stroke-width=".65"/></pattern></defs>
              <rect width="400" height="435" fill="#dfe5d9"/><rect width="400" height="435" fill="url(#grid)"/>
              <circle cx="200" cy="202" r="134" fill="#f2f1e6"/>
              <path d="M68 435v-53c0-71 58-126 132-126s132 55 132 126v53" fill="#91a58c"/>
              <path d="M162 254v39c0 29 76 29 76 0v-39" fill="#b3bea7"/>
              <ellipse cx="200" cy="192" rx="66" ry="79" fill="#bac6af"/>
              <path d="M133 187c-9-65 27-104 73-104 52 0 72 42 61 109l-17-32c-32 8-65 0-80-18z" fill="#506e55"/>
              <path d="M25 48V25h23M352 25h23v23M375 387v23h-23M48 410H25v-23" fill="none" stroke="#506e55" stroke-width="2"/>
            </svg>
            <img id="profile-photo" alt="프로필 사진" hidden decoding="async">
          </div>
          <figcaption class="sr-only" id="photo-caption">사진 준비 중</figcaption>
        </figure>
          <div class="profile-details">
            <h1 id="profile-name" data-name>이름 입력</h1>
            <p class="profile-school" id="school">학교명 입력</p>
            <p class="profile-major" id="major">전공명 입력</p>
            <div class="profile-contacts" aria-label="연락처 및 블로그">
              <p><span class="contact-label">메일</span><span id="contact-email" aria-disabled="true">이메일 입력 예정</span></p>
              <p><span class="contact-label">블로그</span><span id="contact-blog" aria-disabled="true">블로그 입력 예정</span></p>
            </div>
          </div>
        </div>
        <div class="profile-github"><span class="button" data-github aria-disabled="true">GitHub 입력 예정 ↗</span></div>
        <section class="skills-section" id="skills" aria-labelledby="skills-title">
          <h2 id="skills-title">기술 스택</h2>
          <div class="stack" id="skill-list"></div>
        </section>
      </aside>
      <section class="about-panel" id="about" aria-labelledby="about-title">
        <div class="section-head"><div><h2 id="about-title">안녕하세요, 김민욱입니다.</h2></div></div>
        <p class="about-copy" id="about-copy">자기소개 적는 칸.</p>
        <section class="interests-section" id="interests" aria-labelledby="interests-title">
          <h3 id="interests-title">관심사</h3>
          <div class="interest-grid" id="interest-list"></div>
        </section>
      </section>
    </div>
    <section class="section" id="projects" aria-labelledby="projects-title">
      <div class="section-head"><div><h2 id="projects-title">프로젝트 및 연구</h2></div></div>
      <div class="projects" id="project-list"></div>
    </section>
    <section class="section" id="guestbook" aria-labelledby="guestbook-title">
      <div class="section-head">
        <div><p class="section-kicker mono">GUESTBOOK</p><h2 id="guestbook-title">방명록</h2></div>
        <p class="section-note">방문한 흔적을 남겨주세요.</p>
      </div>
      <div class="guestbook-layout">
        <form id="guestbook-form" class="guestbook-form" aria-describedby="guestbook-help">
          <p id="guestbook-help" class="section-note">누구나 볼 수 있는 공간입니다. 연락처 등 개인정보는 남기지 마세요.</p>
          <label for="guestbook-name">이름 <span class="field-limit">최대 40자</span></label>
          <input id="guestbook-name" name="name" required autocomplete="nickname" aria-describedby="name-count">
          <span id="name-count" class="field-count">0 / 40</span>
          <label for="guestbook-message">메시지 <span class="field-limit">최대 1,000자</span></label>
          <textarea id="guestbook-message" name="message" rows="5" required aria-describedby="message-count"></textarea>
          <span id="message-count" class="field-count">0 / 1,000</span>
          <button class="button primary" id="guestbook-submit" type="submit">글 남기기</button>
          <p id="guestbook-form-status" class="guestbook-status" role="status" aria-live="polite"></p>
        </form>
        <div class="guestbook-feed">
          <div class="guestbook-toolbar"><h3>남겨주신 이야기</h3><button class="button" id="guestbook-refresh" type="button">새로고침</button></div>
          <p id="guestbook-list-status" class="guestbook-status" role="status" aria-live="polite">방명록을 불러오는 중입니다.</p>
          <ul id="guestbook-list" class="guestbook-list" aria-label="방명록 글" aria-busy="true"></ul>
          <button class="button" id="guestbook-more" type="button" hidden>더 불러오기</button>
        </div>
      </div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><p>© <span id="year">2026</span> <span data-name>나의 포트폴리오</span>. </p><a href="#main">맨 위로 ↑</a></div></footer>
  <noscript><p class="wrap empty-note">관심사·기술 스택·프로젝트 및 연구 목록을 보려면 브라우저에서 JavaScript를 활성화해주세요.</p></noscript>
